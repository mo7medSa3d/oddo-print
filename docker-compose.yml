services:
  postgres:
    image: localhost/yaseir-postgres:${YASEIR_DEPLOYMENT_ID:-local}
    build:
      context: .
      dockerfile: Dockerfile.secure-images
      target: postgres
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB:-yasser_db}
      POSTGRES_USER: ${POSTGRES_USER:-odoo_print}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - printer_backend

  database_roles:
    image: localhost/yaseir-gateway:${YASEIR_DEPLOYMENT_ID:-local}
    labels:
      com.yaseir.release: ${YASEIR_DEPLOYMENT_ID:-}
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: UTC
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-yasser_db}
      PGUSER: ${POSTGRES_USER:-odoo_print}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-yaseir_owner}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-yaseir_runtime}
      POSTGRES_OWNER_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      YASEIR_DB_PROFILE_CONFIRM: ${POSTGRES_DB:-yasser_db}
      YASEIR_DB_ROLE_STATE_DIR: /var/lib/yaseir-role-state
    secrets:
      - postgres_password
      - postgres_owner_password
      - postgres_runtime_password
    volumes:
      - role_state:/var/lib/yaseir-role-state
    command: ["node", "scripts/postgres-role-profile.mjs", "apply"]
    networks:
      - printer_backend

  migrate:
    image: localhost/yaseir-gateway:${YASEIR_DEPLOYMENT_ID:-local}
    labels:
      com.yaseir.release: ${YASEIR_DEPLOYMENT_ID:-}
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      database_roles:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: UTC
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-yasser_db}
      PGUSER: ${POSTGRES_OWNER_USER:-yaseir_owner}
      PGPASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets:
      - postgres_owner_password
    command: ["node", "--import", "tsx", "scripts/db-migrate.ts"]
    networks:
      - printer_backend

  database_verify:
    image: localhost/yaseir-gateway:${YASEIR_DEPLOYMENT_ID:-local}
    labels:
      com.yaseir.release: ${YASEIR_DEPLOYMENT_ID:-}
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-yasser_db}
      PGUSER: ${POSTGRES_RUNTIME_USER:-yaseir_runtime}
      PGPASSWORD_FILE: /run/secrets/postgres_runtime_password
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-yaseir_runtime}
    secrets:
      - postgres_runtime_password
    command: ["node", "scripts/postgres-role-profile.mjs", "verify-runtime"]
    networks:
      - printer_backend

  gateway:
    image: localhost/yaseir-gateway:${YASEIR_DEPLOYMENT_ID:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public release identifier only, NEVER a secret. Supply the same
        # immutable SHA at build and runtime for Next.js version-skew recovery.
        YASEIR_DEPLOYMENT_ID: ${YASEIR_DEPLOYMENT_ID:-}
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    depends_on:
      database_verify:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      TZ: UTC
      HOSTNAME: 0.0.0.0
      PORT: 3000
      YASEIR_DEPLOYMENT_ID: ${YASEIR_DEPLOYMENT_ID:-}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set to the public Gateway URL}
      # Optional providers stay disabled when unset; their absence must not
      # prevent the core Gateway from starting.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      YASEIR_PLAN_CATALOG: ${YASEIR_PLAN_CATALOG:-}
      YASEIR_ACTIVATION_WHATSAPP: ${YASEIR_ACTIVATION_WHATSAPP:-}
      YASEIR_AGENT_DOWNLOAD_URL: ${YASEIR_AGENT_DOWNLOAD_URL:-}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-yasser_db}
      PGUSER: ${POSTGRES_RUNTIME_USER:-yaseir_runtime}
      PGPASSWORD_FILE: /run/secrets/postgres_runtime_password
      GATEWAY_JWT_SECRET_FILE: /run/secrets/gateway_jwt_secret
      MANAGER_USERNAME: ${MANAGER_USERNAME:-admin}
      MANAGER_PASSWORD_HASH_FILE: /run/secrets/manager_password_hash
      ALLOW_PLAINTEXT_MANAGER_PASSWORD:
      # Keep Secure enabled for HTTPS. Set COOKIE_SECURE=0 only for an
      # intentionally HTTP-only test deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      STALE_AGENT_THRESHOLD_SECONDS: ${STALE_AGENT_THRESHOLD_SECONDS:-90}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TRUST_PROXY_SECRET_FILE: /run/secrets/trust_proxy_secret
      LICENSE_SIGNING_PRIVATE_KEY_PEM_FILE: /run/secrets/license_signing_private_key_pem
      LICENSE_SIGNING_KEY_ID: ${LICENSE_SIGNING_KEY_ID:-k1}
      PLATFORM_TENANT_ID: ${PLATFORM_TENANT_ID:-}
    secrets:
      - postgres_runtime_password
      - gateway_jwt_secret
      - manager_password_hash
      - trust_proxy_secret
      - license_signing_private_key_pem
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - printer_backend

  caddy:
    image: localhost/yaseir-caddy:${YASEIR_DEPLOYMENT_ID:-local}
    build:
      context: .
      dockerfile: Dockerfile.secure-images
      target: caddy
    restart: unless-stopped
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Per-container network namespace only. Permit the unprivileged UID to
    # bind 80/443 without root, file capabilities or CAP_NET_BIND_SERVICE.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?GATEWAY_DOMAIN must be set to a DNS name for production TLS}
    secrets:
      - trust_proxy_secret
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - printer_backend

volumes:
  postgres_data:
  role_state:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  postgres_owner_password:
    environment: POSTGRES_OWNER_PASSWORD
  postgres_runtime_password:
    environment: POSTGRES_RUNTIME_PASSWORD
  gateway_jwt_secret:
    environment: GATEWAY_JWT_SECRET
  manager_password_hash:
    environment: MANAGER_PASSWORD_HASH
  trust_proxy_secret:
    environment: TRUST_PROXY_SECRET
  license_signing_private_key_pem:
    environment: LICENSE_SIGNING_PRIVATE_KEY_PEM

networks:
  printer_backend:
    driver: bridge
