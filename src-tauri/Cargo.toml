[package]
name = "yasser-manager"
version = "1.0.0"
description = "Yasser Manager — desktop management for Yasser Agent"
authors = ["Yasser"]
license = "MIT"
repository = "https://github.com/mo7medSa3d/oddo-print"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
url = "2.5.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

# Production binary: maximize inlining, strip symbols, single codegen unit.
# Panics stay as unwind so the panic hook in logging.rs can record them
# before the process terminates.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
debug = false
