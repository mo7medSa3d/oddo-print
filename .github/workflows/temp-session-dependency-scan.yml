name: TEMP Session Dependency Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan legacy session dependencies
        run: |
          set -euo pipefail
          echo '--- managerSessions refs ---'
          git grep -n 'managerSessions' -- ':!src/lib/manager-auth.ts' ':!drizzle/0030_tenant_domains_and_manager_sessions.sql' || true
          echo '--- platformSessions refs ---'
          git grep -n 'platformSessions' -- ':!src/lib/platform-auth.ts' ':!drizzle/0030_tenant_domains_and_manager_sessions.sql' || true
          echo '--- legacy session constructors ---'
          git grep -n -E 'createManagerSession\(|revokeManagerSession\(|managerCookieHeader\(|platformCookieHeader\(' -- 'src' 'tests' 'server.ts' ':!src/lib/manager-auth.ts' ':!src/lib/platform-auth.ts' ':!src/lib/manager-session-tx.ts' || true
          echo '--- legacy marker refs ---'
          git grep -n 'LEGACY_SESSION_MAX_AGE_SECONDS' -- 'src' 'tests' 'server.ts' || true
          echo '--- all refresh endpoints ---'
          find src/app/api -path '*/refresh/route.ts' -print | sort
          echo '--- auth timing host-clock refs ---'
          git grep -n -E 'Date\.now\(\)|new Date\(\)' -- src/lib/session-tokens.ts src/app/api/auth src/app/api/platform/auth src-tauri/src/commands.rs || true
