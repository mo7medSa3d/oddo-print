name: TEMP Verify Auth Closure

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
      GATEWAY_JWT_SECRET: verification-secret-32-characters-minimum
      COOKIE_SECURE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run migrations
        run: npm run db:migrate
      - name: Auth/session integration suite
        run: |
          npm run test:integration --             tests/auth-rate-limit.test.ts             tests/auth-rate-limit-fail-closed.test.ts             tests/manager-auth.test.ts             tests/platform-control-plane.test.ts             tests/multi-tenant-selection.test.ts             tests/session-tokens.integration.test.ts             tests/session-logout.integration.test.ts             tests/session-legacy-fallback.integration.test.ts
      - name: Auth/session unit contracts
        run: |
          npm run test:unit --             tests/desktop-auth-contract.test.ts             tests/production-type-safety.contract.test.ts
      - name: Python security contracts
        run: pytest tests/test_security_contracts.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@9eec9a4c3a3ec18e14f2f9e2e996e24799b8e4b9 # v1
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --locked
