name: TEMP Verify Auth Closure

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
      GATEWAY_JWT_SECRET: verification-secret-32-characters-minimum
      COOKIE_SECURE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run migrations
        run: npm run db:migrate
      - name: Auth/session integration suite
        run: |
          npm run test:integration --             tests/auth-rate-limit.test.ts             tests/auth-rate-limit-fail-closed.test.ts             tests/manager-auth.test.ts             tests/platform-control-plane.test.ts             tests/multi-tenant-selection.test.ts             tests/session-tokens.integration.test.ts             tests/session-logout.integration.test.ts             tests/session-legacy-fallback.integration.test.ts
      - name: Auth/session unit contracts
        run: |
          npm run test:unit --             tests/desktop-auth-contract.test.ts             tests/production-type-safety.contract.test.ts
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Python security contracts
        run: pytest tests/test_security_contracts.py
      - name: Repository legacy-session inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "== legacy session references =="
          git grep -nE 'managerSessions|platformSessions|manager_sessions|platform_sessions|LEGACY_SESSION_MAX_AGE_SECONDS|SESSION_MAX_AGE_SECONDS|createManagerSession|createPlatformSession|issueCustomerSession|mgr_session|cust_session|plt_session|mgr_refresh|cust_refresh|plt_refresh' -- src tests || true
          echo "== forbidden new-write patterns =="
          if git grep -nE 'insert\((managerSessions|platformSessions)\)|INSERT INTO (manager_sessions|platform_sessions)' -- src; then
            echo "ERROR: new-session legacy write path found"
            exit 1
          fi
          if git grep -n 'src/lib/manager-session-tx' -- src tests; then
            echo "ERROR: obsolete manager-session-tx dependency found"
            exit 1
          fi
          echo "== host-clock calls in session security source =="
          if git grep -nE 'Date\.now\(\)|new Date\(\)' -- src/lib/session-tokens.ts src/app/api/auth/manager src/app/api/platform/auth src/app/api/auth/refresh src/app/api/auth/login src/app/api/auth/logout; then
            echo "ERROR: host-clock timing call found in security session paths"
            exit 1
          fi
          echo "LEGACY INVENTORY: no forbidden legacy-write/adapter/host-clock dependency found."

