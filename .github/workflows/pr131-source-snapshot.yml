name: PR131 Source Snapshot

on:
  push:
    branches: [audit/pr131-source-20261009]
    paths: [.github/workflows/pr131-source-snapshot.yml]

permissions:
  contents: write

jobs:
  prepare-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable audit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 75969fd4a3f2905075b4584aed114b428d434d80
      - name: Install patched Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.9
          cache: false
      - name: Regenerate and verify module lock
        working-directory: agent
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.9
          go mod edit -toolchain=go1.26.9
          go get golang.org/x/net@v0.60.0
          go mod tidy
          go mod verify
      - name: Repair only missing source references in existing Arabic translations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path('odoo_addons/print_gateway/i18n/ar.po')
          changes = {
              'Gateway print failed for bound printer. Native download cancelled.': ['models/ir_actions_report.py'],
              'Print status is unknown. Check the printer before trying again.': ['models/ir_actions_report.py'],
              'Printing Service': ['models/ir_actions_report.py'],
              'Printing service request timed out.': ['static/src/js/pos_sale_details_router.js', 'static/src/js/report_interceptor.js'],
              'Receipt rendering timed out.': ['static/src/js/pos_sale_details_router.js'],
          }
          text = path.read_text(encoding='utf-8')
          for term, relatives in changes.items():
              needle = 'msgid ' + json.dumps(term) + '\n'
              occurrence = ''.join('#: code:addons/print_gateway/' + relative + ':0\n' for relative in relatives)
              assert text.count(needle) == 1, term
              text = text.replace(needle, occurrence + needle, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check-odoo-translations.py
      - name: Create isolated review commit without modifying main or PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 75969fd4a3f2905075b4584aed114b428d434d80
          git add agent/go.mod agent/go.sum odoo_addons/print_gateway/i18n/ar.po
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): patch Go HTTP vulnerabilities and complete Arabic print catalog'
          git push origin HEAD:refs/heads/audit/pr131-security-ready-20261009
          git rev-parse HEAD
      - name: Upload reviewed repair files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pr131-security-and-catalog-repair
          path: |
            agent/go.mod
            agent/go.sum
            odoo_addons/print_gateway/i18n/ar.po
          retention-days: 1
          if-no-files-found: error
