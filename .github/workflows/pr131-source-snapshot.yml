name: PR131 Source Snapshot

on:
  push:
    branches: [audit/pr131-source-20261009]
    paths: [.github/workflows/pr131-source-snapshot.yml]

permissions:
  contents: read

jobs:
  security-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable audit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 75969fd4a3f2905075b4584aed114b428d434d80
          persist-credentials: false
      - name: Install patched Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.9
          cache: false
      - name: Regenerate and verify module lock
        working-directory: agent
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.9
          go mod edit -toolchain=go1.26.9
          go get golang.org/x/net@v0.60.0
          go mod tidy
          go mod verify
          git diff -- go.mod go.sum
      - name: Upload reviewed lockfiles
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pr131-security-lock-go1.26.9
          path: |
            agent/go.mod
            agent/go.sum
          retention-days: 1
          if-no-files-found: error
