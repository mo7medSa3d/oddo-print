name: HTTP Staging Transport

on:
  push:
    branches: [test/http-server-ready]
  pull_request:
    branches: [test/http-server-ready]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-e2e:
    name: HTTP Gateway + Agent transport E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify Go Agent accepts HTTP and HTTPS
        working-directory: agent
        run: go test -mod=readonly ./internal/config -run 'TestConfigValidateAcceptsHTTPAndHTTPSOnStaging|TestConfigValidateAcceptsHTTPSByDefault' -count=1

      - name: Validate HTTPS domain staging contract
        run: |
          set -euo pipefail
          bash -n deploy/domain-test/setup-domain-test.sh
          bash -n deploy/domain-test/smoke-domain-test.sh
          npm exec vitest run --config vitest.unit.config.mts tests/domain-staging-deployment.contract.test.ts
          cp deploy/domain-test/.env.domain-test.example /tmp/yasser-domain-test.env
          docker compose --env-file /tmp/yasser-domain-test.env -f deploy/domain-test/docker-compose.yml config -q

      - name: Start isolated HTTP Gateway
        env:
          SERVER_PUBLIC_IP: 127.0.0.1
          HTTP_TEST_PORT: 18080
        run: bash deploy/http-test/setup-http-test.sh

      - name: Run HTTP transport smoke
        env:
          SMOKE_BASE_URL: http://127.0.0.1:18080
        run: bash deploy/http-test/smoke-http-test.sh

      - name: Collect HTTP stack diagnostics
        if: failure()
        run: |
          if [ -f deploy/http-test/.env.http-test ]; then
            docker compose --env-file deploy/http-test/.env.http-test -f deploy/http-test/docker-compose.yml ps || true
            docker compose --env-file deploy/http-test/.env.http-test -f deploy/http-test/docker-compose.yml logs --no-color --tail=200 gateway caddy migrate || true
          fi

      - name: Tear down isolated HTTP stack
        if: always()
        run: |
          if [ -f deploy/http-test/.env.http-test ]; then
            docker compose --env-file deploy/http-test/.env.http-test -f deploy/http-test/docker-compose.yml down --remove-orphans -v || true
          fi
