name: TEMP Scan Legacy Session Dependencies

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan legacy session references
        shell: bash
        run: |
          set +e
          echo "=== Session lifetime constants ==="
          git grep -nE 'SESSION_MAX_AGE_SECONDS|DEFAULT_SESSION_MAX_AGE_SECONDS|MAX_AGE_SECONDS|8[[:space:]]*\*[[:space:]]*60[[:space:]]*\*[[:space:]]*60' -- src tests

          echo "=== Legacy DB session writes ==="
          git grep -nE 'insert\((managerSessions|platformSessions)|INSERT INTO (manager_sessions|platform_sessions)' -- src

          echo "=== Legacy DB session revoke/cleanup ==="
          git grep -nE 'managerSessions\.(delete|update)|platformSessions\.(delete|update)|DELETE FROM (manager_sessions|platform_sessions)' -- src

          echo "=== Old session factory calls ==="
          git grep -nE 'createManagerSession\(|createPlatformSession\(|issueCustomerSession\(' -- src

          echo "=== Session cookie literals ==="
          git grep -nE 'mgr_session|cust_session|plt_session|mgr_refresh|cust_refresh|plt_refresh' -- src

          echo "=== Host clock usage in session/auth files ==="
          git grep -nE 'Date\.now\(\)|new Date\(\)' -- src/lib/manager-auth.ts src/lib/platform-auth.ts src/lib/customer-auth.ts src/lib/session-tokens.ts src/app/api/auth src/app/api/platform/auth 2>/dev/null

          echo "=== Refresh implementation ==="
          git grep -nE 'rotateRefreshToken|revokeSessionFamily|cleanupExpiredRefreshTokens|refreshPrincipalStillValid' -- src

          echo "=== TEMP workflow names ==="
          find .github/workflows -maxdepth 1 -type f -iname '*temp*' -print
