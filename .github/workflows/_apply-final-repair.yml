func TestDesiredLifecycleExecutionGate(t *testing.T) {
    a := &Agent{desiredStates: map[string]desiredPrinterRecord{
        "active": {Desired: desiredPrinterWire{ID: "active", Lifecycle: "active", DesiredRevision: 3}, AppliedDesiredRevision: 3},
        "stale": {Desired: desiredPrinterWire{ID: "stale", Lifecycle: "active", DesiredRevision: 3}, AppliedDesiredRevision: 2},
        "disabled": {Desired: desiredPrinterWire{ID: "disabled", Lifecycle: "disabled", DesiredRevision: 3}, AppliedDesiredRevision: 3},
