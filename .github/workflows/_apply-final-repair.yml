    if !a.isPrinterExecutionAllowed("active") { t.Fatal("active/applied printer blocked") }
    if a.isPrinterExecutionAllowed("stale") { t.Fatal("stale printer allowed") }
    if a.isPrinterExecutionAllowed("disabled") { t.Fatal("disabled printer allowed") }
    if !a.isPrinterExecutionAllowed("legacy") { t.Fatal("unmanaged printer blocked") }
}
