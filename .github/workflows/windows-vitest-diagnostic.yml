name: Windows vitest diagnostic

# Temporary, dispatch-only diagnostic.
#
# `build-windows` fails at "Run Vitest suite" on main @ 30a4221 and on the
# redesign branch. Workflow logs are not readable from the authoring
# environment (the log blob endpoint returns EOF) but check-run *annotations*
# are, so this job runs the same vitest command on the same Windows runner for
# both refs and republishes each failing test as an annotation. That gives a
# like-for-like comparison of the two failures instead of assuming they match.
#
# Delete once the Windows failure is understood and repaired.

on:
  # Dispatch needs the file on the default branch, which this branch does not
  # have; a path-filtered push trigger gives the same control and does not fire
  # on unrelated commits.
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/windows-vitest-diagnostic.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    name: vitest (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base-30a4221
            ref: 30a422179bf0fd981a53c332d2874779725b9754
          - label: branch-head
            ref: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest suite
        shell: bash
        run: |
          set -uo pipefail
          npm run test -- --reporter=default --reporter=json --outputFile=vitest-results.json > /tmp/vitest.txt 2>&1 || true
          tail -n 25 /tmp/vitest.txt
      - name: Publish failing tests as annotations
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          node -e '
            const fs = require("fs");
            const label = process.env.MATRIX_LABEL || "branch-head";
            let report = null;
            try { report = JSON.parse(fs.readFileSync("vitest-results.json", "utf8")); }
            catch (error) { console.log("::error::could not read vitest-results.json"); process.exit(0); }
            const failures = [];
            for (const file of report.testResults || []) {
              for (const assertion of file.assertionResults || []) {
                if (assertion.status !== "failed") continue;
                const message = (assertion.failureMessages || []).join("\n");
                const first = message.split("\n").find((line) => line.trim()) || "";
                failures.push({ file: file.name, name: assertion.fullName, first, message });
              }
            }
            console.log(`::notice::${label}: ${failures.length} failing test(s) of ${report.numTotalTests}`);
            for (const failure of failures.slice(0, 40)) {
              const text = (`${failure.name} :: ${failure.first}`).slice(0, 900)
                .replace(/%/g, "%25").replace(/\r?\n/g, "%0A");
              const file = failure.file.replace(`${process.cwd()}\\`, "").replace(`${process.cwd()}/`, "").replace(/\\/g, "/");
              console.log(`::error file=${file}::${text}`);
            }
          '
        env:
          MATRIX_LABEL: ${{ matrix.label }}
