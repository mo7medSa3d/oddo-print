name: TEMP Verify Auth Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run migrations
        run: npm run db:migrate
      - name: Run auth unit tests
        run: npm run test:unit -- tests/auth-rate-limit-fail-closed.test.ts tests/desktop-auth-contract.test.ts tests/multi-tenant-selection.test.ts tests/auth-register-existing-account.test.ts tests/resend-verification.test.ts
      - name: Run auth integration tests
        run: npm run test:integration -- tests/manager-auth.test.ts tests/platform-control-plane.test.ts tests/auth-rate-limit.test.ts tests/session-tokens.integration.test.ts tests/session-legacy-fallback.integration.test.ts tests/session-logout.integration.test.ts
