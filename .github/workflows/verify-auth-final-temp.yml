name: TEMP Verify Auth Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-auth-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run migrations
        run: npm run db:migrate
      - name: Drizzle migration consistency
        run: npx drizzle-kit check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Full final security hardening
        run: python -m pip install pytest && pytest tests/test_final_security_hardening.py
      - name: Manager auth
        run: npm run test:integration -- tests/manager-auth.test.ts
      - name: Platform auth
        run: npm run test:integration -- tests/platform-control-plane.test.ts
      - name: Customer auth
        run: npm run test:unit -- tests/multi-tenant-selection.test.ts
      - name: Rate-limit suite
        run: npm run test:integration -- tests/auth-rate-limit.test.ts
      - name: Rate-limit fail closed
        run: npm run test:unit -- tests/auth-rate-limit-fail-closed.test.ts
      - name: Session rotation
        run: npm run test:integration -- tests/session-tokens.integration.test.ts
      - name: Session logout
        run: npm run test:integration -- tests/session-logout.integration.test.ts
      - name: Legacy fallback
        run: npm run test:integration -- tests/session-legacy-fallback.integration.test.ts
      - name: Desktop auth contract
        run: npm run test:unit -- tests/desktop-auth-contract.test.ts
      - name: Exact legacy inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "== old session stores =="
          for needle in managerSessions platformSessions manager-session-tx SESSION_MAX_AGE_SECONDS LEGACY_SESSION_MAX_AGE_SECONDS; do
            echo "--- $needle ---"
            git grep -nF "$needle" -- src tests scripts || true
          done
          echo "== NEW session writes into old stores =="
          git grep -nE 'db\.insert\((managerSessions|platformSessions)\)|tx\.insert\((managerSessions|platformSessions)\)' -- src || true
