name: Main Branch Governance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-main-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          protected=$(gh api "repos/${REPOSITORY}/branches/main" --jq '.protected')
          rules_json=$(gh api "repos/${REPOSITORY}/rules/branches/main")
          has_ruleset_protection=$(printf '%s' "$rules_json" | jq 'any(.[]; .type == "pull_request" or .type == "required_status_checks")')
          if [[ "$protected" != "true" && "$has_ruleset_protection" != "true" ]]; then
            echo "ERROR: main branch has neither classic branch protection nor an active ruleset with merge-safety rules. Configure GitHub branch protection or a ruleset before merging production changes."
            exit 1
          fi
          if [[ "$protected" == "true" ]]; then
            echo "main branch classic protection is enabled."
          else
            echo "main branch is governed by active rules."
          fi
          # Required checks can be configured by classic branch protection or
          # rulesets. Inspect both sources instead of assuming .protected covers
          # ruleset-only repositories.
          required=$(gh api "repos/${REPOSITORY}/branches/main" --jq '.required_status_checks.contexts // [] | join("\n")' 2>/dev/null || true)
          rules_required=$(printf '%s' "$rules_json" | jq -r '
            .[]
            | select(.type == "required_status_checks")
            | (.parameters.required_status_checks // [])
            | .[]?.context
          ' 2>/dev/null || true)
          required=$(printf '%s\n%s\n' "$required" "$rules_required" | sed '/^$/d' | sort -u)
          echo "required checks: ${required:-<none>}"
          missing=""
          for expected in ci odoo19; do
            if ! grep -qw "$expected" <<< "$required"; then
              echo "::warning::Required status check '$expected' is not configured on main - merge gating is currently advisory only. A repository admin must add 'ci' and 'odoo19' to the branch protection required checks; this workflow cannot configure repository settings by itself."
              missing="$missing $expected"
            fi
          done
          if [ -n "$missing" ]; then
            echo "ACTION REQUIRED (repository settings, not code): configure required status checks [${missing} ] on main. Proceeding without failing this run because the setting is outside any PR's control - see the warnings above."
          else
            echo "required checks for ci and odoo19 are configured."
          fi
