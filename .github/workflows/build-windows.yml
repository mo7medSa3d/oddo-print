name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - name: Verify Cargo.lock
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/Cargo.lock)) { throw "src-tauri/Cargo.lock is required and must be committed" }
          Push-Location src-tauri
          cargo metadata --locked --no-deps --format-version 1 | Out-Null
          Pop-Location
          Write-Host "Cargo.lock is present and Cargo accepts the manifest in --locked mode."
      - name: Cache Rust and Tauri
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-
      - name: Install Tauri CLI
        shell: pwsh
        run: |
          $tauri = Get-Command cargo-tauri -ErrorAction SilentlyContinue
          if ($tauri) {
            cargo tauri --version
            Write-Host "Tauri CLI restored from cache; skipping install."
          } else {
            Write-Host "Tauri CLI not found in cache; installing 2.11.4..."
            cargo install tauri-cli --version "=2.11.4" --locked
          }
      - name: Agent Phase 0 - Go build
        working-directory: agent
        shell: pwsh
        run: |
          go mod verify
          go build -mod=readonly ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Agent Phase 0 - Go vet
        working-directory: agent
        shell: pwsh
        run: |
          go vet -mod=readonly ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Agent Phase 0 - Go race tests
        working-directory: agent
        shell: pwsh
        run: |
          go test -mod=readonly ./... -race
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tauri Phase 0 - cargo audit
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Go Agent resources for Tauri
        working-directory: agent
        shell: pwsh
        run: |
          go build -mod=readonly -trimpath -ldflags="-s -w" -o YasserAgent.exe ./cmd/agent
          go build -mod=readonly -trimpath -ldflags="-s -w" -o yasser-agent-cli.exe ./cmd/cli
          if (-not (Test-Path .\YasserAgent.exe)) { throw "Missing agent/YasserAgent.exe" }
          if (-not (Test-Path .\yasser-agent-cli.exe)) { throw "Missing agent/yasser-agent-cli.exe" }

      - name: Install frontend dependencies
        run: npm ci
      - name: Build desktop frontend before Rust validation
        run: npm run desktop:vite:build

      - name: Tauri Phase 0 - cargo check
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo check --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tauri Phase 0 - cargo build --locked
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tauri Phase 0 - cargo test
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Run Vitest suite
        run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Report skipped (DB-gated) tests explicitly
        shell: pwsh
        run: |
          $json = Get-Content vitest-results.json -Raw | ConvertFrom-Json
          $skipped = [int]$json.numPendingTests
          $total = [int]$json.numTotalTests
          Write-Host "Vitest: $skipped of $total tests SKIPPED (DB-gated suites; no Postgres on this runner)."
          if ($skipped -gt 0) {
            Write-Host "No Postgres service on this runner — $skipped integration test(s) were skipped in the Windows build. Full integration coverage runs in the CI workflow (.github/workflows/ci.yml)."
          }
      - name: Verify Go binaries
        shell: pwsh
        run: |
          $agent = "agent\YasserAgent.exe"
          $cli = "agent\yasser-agent-cli.exe"
          if (-not (Test-Path $agent)) { throw "Missing YasserAgent.exe" }
          if (-not (Test-Path $cli)) { throw "Missing yasser-agent-cli.exe" }
          Get-Item $agent | Select-Object FullName, Length
          Get-Item $cli | Select-Object FullName, Length
      - name: Verify Odoo module icon matches desktop Yasser icon
        shell: pwsh
        run: |
          $odooHash = (Get-FileHash "odoo_addons/print_gateway/static/description/icon.png" -Algorithm SHA256).Hash
          $desktopHash = (Get-FileHash "src-tauri/icons/icon.png" -Algorithm SHA256).Hash
          if ($odooHash -ne $desktopHash) {
            throw "Odoo module icon does not match the desktop Yasser icon."
          }
          Write-Host "Verified identical Odoo and desktop Yasser icons: $odooHash"

      - name: Verify Tauri icon assets
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $icons = @($conf.bundle.icon)
          if ($icons.Count -eq 0) { throw "No bundle.icon entries in src-tauri/tauri.conf.json" }
          foreach ($icon in $icons) {
            $p = Join-Path "src-tauri" ($icon -replace '/', '\\')
            if (-not (Test-Path $p)) { throw "Missing configured icon: $p" }
            $len = (Get-Item $p).Length
            if ($len -le 0) { throw "Empty configured icon: $p" }
            Write-Host "OK icon $icon ($len bytes)"
          }
          Write-Host "All $($icons.Count) configured icons are present."
      - name: Rust unit tests (desktop)
        shell: pwsh
        run: |
          Push-Location src-tauri
          cargo test --locked
          Pop-Location
      - name: Clean stale Tauri installer bundles
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          foreach ($dir in @("msi", "nsis")) {
            $path = Join-Path $bundleRoot $dir
            if (Test-Path $path) {
              Remove-Item -Recurse -Force $path
            }
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }
          Write-Host "Removed stale MSI/NSIS bundle outputs before packaging."

      - name: Build Tauri Windows installer (MSI + NSIS EXE)
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Tauri installer build attempt $attempt/$maxAttempts"
            & cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Tauri installer build succeeded on attempt $attempt."
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "Tauri installer build failed after $maxAttempts attempts."
            }
            $delay = 15 * $attempt
            Write-Warning "Tauri bundling failed (exit code $LASTEXITCODE). Retrying in $delay seconds; transient tool downloads such as WiX may have failed."
            Start-Sleep -Seconds $delay
          }
      - name: Verify installer artifacts exist
        shell: pwsh
        run: |
          $msiDir = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi"
          $nsisDir = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis"
          $msi = @(Get-ChildItem (Join-Path $msiDir "Yasser Print Manager_*.msi") -File -ErrorAction SilentlyContinue)
          $exe = @(Get-ChildItem (Join-Path $nsisDir "Yasser Print Manager_*-setup.exe") -File -ErrorAction SilentlyContinue)
          $legacyMsi = @(Get-ChildItem (Join-Path $msiDir "*Odoo Print Manager*.msi") -File -ErrorAction SilentlyContinue)
          $legacyExe = @(Get-ChildItem (Join-Path $nsisDir "*Odoo Print Manager*.exe") -File -ErrorAction SilentlyContinue)
          if ($msi.Count -ne 1) { throw "Expected exactly one Yasser Print Manager MSI, found $($msi.Count)" }
          if ($exe.Count -ne 1) { throw "Expected exactly one Yasser Print Manager NSIS installer, found $($exe.Count)" }
          if ($legacyMsi.Count -ne 0 -or $legacyExe.Count -ne 0) {
            throw "Legacy Odoo Print Manager installer output detected; refusing to package it."
          }
          Write-Host "MSI:"
          $msi | Select-Object FullName, Length
          Write-Host "NSIS EXE:"
          $exe | Select-Object FullName, Length
      - name: Install MSI and smoke-test installed app
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\msi\Yasser Print Manager_*.msi" | Select-Object -First 1
          if (-not $msi) { throw "Yasser Print Manager MSI bundle missing" }
          $msiLog = Join-Path $env:RUNNER_TEMP "yasser-msi-install.log"
          $proc = Start-Process msiexec -ArgumentList @(
            "/i", "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "`"$msiLog`""
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-Content $msiLog -Tail 200
            throw "MSI install failed with code $($proc.ExitCode)"
          }
          $candidateDirs = @(
            (Join-Path $env:ProgramFiles "Yasser\Yasser Print Manager"),
            (Join-Path $env:ProgramFiles "Yasser Print Manager"),
            (Join-Path $env:ProgramFiles "yasser-manager"),
            (Join-Path ${env:ProgramFiles(x86)} "Yasser\Yasser Print Manager"),
            (Join-Path ${env:ProgramFiles(x86)} "Yasser Print Manager"),
            (Join-Path $env:LOCALAPPDATA "Programs\Yasser Print Manager"),
            (Join-Path $env:LOCALAPPDATA "Programs\Yasser Print Manager")
          )
          $installDir = $candidateDirs | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $installDir) {
            $regKeys = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match "^Yasser( Manager)?$" }
            foreach ($k in $regKeys) {
              if ($k.InstallLocation -and (Test-Path $k.InstallLocation)) {
                $installDir = $k.InstallLocation
                break
              }
            }
          }
          if (-not $installDir) {
            $foundExe = Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA\Programs") -Filter "Yasser*.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundExe) {
              $installDir = $foundExe.DirectoryName
            }
          }
          if (-not $installDir) {
            Write-Host "Listing Program Files:"
            Get-ChildItem $env:ProgramFiles -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName
            Get-Content $msiLog -Tail 100
            throw "Installed directory missing after MSI install"
          }
          Write-Host "Found installed directory: $installDir"
          & pwsh -NoProfile -File .\scripts\smoke-test-windows.ps1 -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { throw "Windows smoke test failed" }
      - name: Install NSIS and smoke-test installed app
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "src-tauri\\target\\x86_64-pc-windows-msvc\\release\\bundle\\nsis\\Yasser Print Manager_*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "Yasser Print Manager NSIS installer missing" }

          $installDir = Join-Path $env:RUNNER_TEMP "Yasser Print Manager NSIS"
          if (Test-Path $installDir) {
            Remove-Item -Recurse -Force $installDir
          }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          # NSIS requires /D=... as the final argument. Keep the destination
          # inside the ephemeral runner temp directory so this test cannot
          # collide with the MSI installation or leave Program Files state.
          $proc = Start-Process -FilePath $nsis.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "NSIS install failed with code $($proc.ExitCode)"
          }
          if (-not (Test-Path $installDir)) {
            throw "NSIS install directory was not created: $installDir"
          }

          & pwsh -NoProfile -File .\\scripts\\smoke-test-windows.ps1 -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { throw "NSIS Windows smoke test failed" }

          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $uninstaller)) {
            $uninstaller = Get-ChildItem $installDir -Filter "uninstall*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $uninstaller) { throw "NSIS uninstaller missing" }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/S") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstall failed with code $($uninstall.ExitCode)"
          }
          if (Test-Path $installDir) {
            $remaining = Get-ChildItem $installDir -Force -ErrorAction SilentlyContinue
            if ($remaining) {
              throw "NSIS uninstall left files behind in $installDir"
            }
          }
          Write-Host "NSIS install, smoke test, and silent uninstall passed."

      - name: Upload Windows MSI and NSIS EXE
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Yasser-Manager-Windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/Yasser Print Manager_*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Yasser Print Manager_*-setup.exe
          if-no-files-found: error
          compression-level: 9
