name: repair-execute

on:
  push:
    branches:
      - production-repair/main-concurrency-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute final repair script
        shell: bash
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" == "chore(repair): finalize desired-state reconciliation" ]]; then
            echo "Final repair commit already applied."
            exit 0
          fi
          awk '/^PY$/{exit} {print}' .github/repair-final.py > /tmp/repair-final.py
          python3 /tmp/repair-final.py
          rm -f .github/workflows/repair-execute.yml
          gofmt -w agent/internal/agent/agent.go agent/internal/agent/desired_state.go
          git diff --check
          npm run typecheck
          (cd agent && go test ./... && go vet ./...)
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(repair): finalize desired-state reconciliation"
          git push origin HEAD:production-repair/main-concurrency-hardening
