name: repair-execute

on:
  push:
    branches:
      - production-repair/main-concurrency-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute final repair script
        shell: bash
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%s)"
          if [[ "$msg" == "chore(repair): finalize desired-state reconciliation" ]]; then
            echo "Final repair commit already applied."
            exit 0
          fi
          python3 .github/repair-final.py
