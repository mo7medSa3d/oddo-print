name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify relative imports only
        shell: bash
        run: |
          set -euo pipefail
          pattern="$(printf '\x40/')"
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude='*.lock' --exclude='*.svg' --exclude='*.png' --exclude='*.ico' "$pattern" .; then
            echo "Path aliases are forbidden. Use relative imports."
            exit 1
          fi
          if grep -nE '"baseUrl"|"paths"' tsconfig.json; then
            echo "TypeScript path mapping is forbidden."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent/go.mod
          cache: true
          cache-dependency-path: agent/go.sum
      - name: Agent Phase 0 - Go build
        working-directory: agent
        run: |
          go mod verify
          go build -mod=readonly ./...
      - name: Agent Phase 0 - Go vet
        working-directory: agent
        run: go vet -mod=readonly ./...
      - name: Agent Phase 0 - Go race tests
        working-directory: agent
        run: go test -mod=readonly ./... -race

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Phase 0 architecture hardening test
        run: npm run test tests/architecture-hardening.test.ts

      - name: Go vulnerability scan
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Go U1000 dead-code scan (Linux)
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" -checks=U1000 ./...
      - name: Go U1000 dead-code scan (Windows build tags)
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          GOOS=windows "$(go env GOPATH)/bin/staticcheck" -checks=U1000 ./...

      - name: Dead-code and unused-export scan
        run: npx --yes knip@6.31.0
      - name: Validate Odoo 19 addon XML conventions
        run: |
          if grep -R -nE '<tree([[:space:]>])|attrs=|states=' odoo_addons/print_gateway/views; then
            echo 'Odoo 19 incompatibility detected.'
            exit 1
          fi
      - name: Verify Odoo module icon matches desktop Yasser icon
        shell: bash
        run: |
          set -euo pipefail
          odoo_icon_sha="$(sha256sum odoo_addons/print_gateway/static/description/icon.png | awk '{print $1}')"
          desktop_icon_sha="$(sha256sum src-tauri/icons/icon.png | awk '{print $1}')"
          test "$odoo_icon_sha" = "$desktop_icon_sha" || {
            echo "Odoo module icon does not match the desktop Yasser icon."
            exit 1
          }
          echo "Verified identical Odoo and desktop Yasser icons: $odoo_icon_sha"

      - name: Run Odoo static contract tests (Python)
        run: |
          pip install pytest
          pytest tests/test_odoo19_printing_static.py tests/test_security_contracts.py tests/test_final_security_hardening.py
      - name: Build Next.js
        run: npm run build
      - name: Run unit tests (no DB)
        run: npm run test:unit
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres -d app_db && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d app_db
      - name: Run Drizzle migrations
        run: npm run db:migrate
      - name: Verify final runtime-only schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            legacy_tables text[] := ARRAY['branches','destinations','document_types','local_networks','printer_bindings'];
            legacy_columns text[] := ARRAY['branch_id','destination_id','local_network_id'];
            table_name_value text;
            column_name_value text;
            expected record;
          BEGIN
            FOREACH table_name_value IN ARRAY legacy_tables LOOP
              IF to_regclass('public.' || table_name_value) IS NOT NULL THEN
                RAISE EXCEPTION 'legacy Gateway business table still exists: %', table_name_value;
              END IF;
            END LOOP;
            FOREACH column_name_value IN ARRAY legacy_columns LOOP
              IF EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND column_name=column_name_value
                  AND table_name IN ('agents','printers','print_jobs','api_keys','discovery_sessions','discovered_devices')
              ) THEN
                RAISE EXCEPTION 'legacy Gateway ownership column still exists: %', column_name_value;
              END IF;
            END LOOP;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='print_jobs' AND column_name='destination'
            ) THEN RAISE EXCEPTION 'print_jobs.destination is missing'; END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='printers' AND column_name='printer_type'
                AND (column_default IS NULL OR column_default NOT LIKE '%physical%')
            ) THEN RAISE EXCEPTION 'printers.printer_type default does not match the application contract (physical)'; END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='printers' AND column_name='connection_type'
                AND (column_default IS NULL OR column_default NOT LIKE '%network%')
            ) THEN RAISE EXCEPTION 'printers.connection_type default does not match the application contract (network)'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='api_keys' AND column_name='read_only_until'
            ) THEN RAISE EXCEPTION 'api_keys.read_only_until is missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='api_keys_read_only_until_check'
            ) THEN RAISE EXCEPTION 'Odoo key rotation state constraint is missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='tenant_subscriptions' AND column_name='entitlement_blocked'
            ) THEN RAISE EXCEPTION 'tenant_subscriptions.entitlement_blocked is missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='tenant_subscriptions' AND column_name='entitlement_blocked_reason'
            ) THEN RAISE EXCEPTION 'tenant_subscriptions.entitlement_blocked_reason is missing'; END IF;
            FOREACH column_name_value IN ARRAY ARRAY['management_source','desired_revision','applied_desired_revision','observed_device_class'] LOOP
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.columns
                WHERE table_schema='public' AND table_name='printers' AND column_name=column_name_value
              ) THEN RAISE EXCEPTION 'desired-state printer column is missing: %', column_name_value; END IF;
            END LOOP;
            IF EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND tablename='printers'
                AND indexname='printers_gateway_id_global_unique'
            ) THEN RAISE EXCEPTION 'global printer id uniqueness must not exist after tenant-scoped identity'; END IF;
            IF EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='printers_pkey'
            ) THEN RAISE EXCEPTION 'printers must not have a global primary key on id'; END IF;
            IF EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='discovered_devices_pkey'
            ) THEN RAISE EXCEPTION 'discovered_devices must not have a global primary key on id'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='printers_tenant_id_unique'
            ) THEN RAISE EXCEPTION 'printers tenant-scoped identity unique constraint is missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND tablename='printers'
                AND indexname='printers_agent_lifecycle_desired_idx'
            ) THEN RAISE EXCEPTION 'desired-state printer index is missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='printers_desired_revision_check'
            ) THEN RAISE EXCEPTION 'desired-state printer revision constraint is missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND tablename='discovery_sessions'
                AND indexname='discovery_sessions_active_agent_unique'
            ) THEN RAISE EXCEPTION 'running discovery session uniqueness index is missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND tablename='print_jobs'
                AND indexname='print_jobs_tenant_idempotency_unique'
            ) THEN RAISE EXCEPTION 'tenant-scoped print idempotency index is missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND tablename='tenant_users'
                AND indexname='tenant_users_single_owner_idx'
            ) THEN RAISE EXCEPTION 'single tenant owner uniqueness index is missing'; END IF;
            -- Verify every runtime cross-object relationship carries tenant
            -- identity into the foreign key. Inspect pg_constraint metadata rather
            -- than the formatted SQL text so harmless PostgreSQL formatting
            -- differences cannot make the release gate flaky.
            FOR expected IN
              SELECT *
              FROM (VALUES
                ('printers', 'agents', ARRAY['tenant_id','agent_id']::text[], ARRAY['tenant_id','id']::text[], false),
                ('discovery_sessions', 'agents', ARRAY['tenant_id','agent_id']::text[], ARRAY['tenant_id','id']::text[], false),
                ('discovered_devices', 'discovery_sessions', ARRAY['tenant_id','discovery_id']::text[], ARRAY['tenant_id','id']::text[], false),
                ('discovered_devices', 'agents', ARRAY['tenant_id','agent_id']::text[], ARRAY['tenant_id','id']::text[], false),
                ('discovered_devices', 'printers', ARRAY['tenant_id','provisioned_printer_id']::text[], ARRAY['tenant_id','id']::text[], false),
                ('print_jobs', 'agents', ARRAY['tenant_id','agent_id']::text[], ARRAY['tenant_id','id']::text[], false),
                ('print_jobs', 'printers', ARRAY['tenant_id','printer_id']::text[], ARRAY['tenant_id','id']::text[], false),
                ('print_jobs', 'api_keys', ARRAY['tenant_id','api_key_id']::text[], ARRAY['tenant_id','id']::text[], false),
                ('job_events', 'print_jobs', ARRAY['tenant_id','job_id']::text[], ARRAY['tenant_id','id']::text[], true)
              ) AS v(child_table, parent_table, child_columns, parent_columns, require_cascade)
            LOOP
              IF NOT EXISTS (
                SELECT 1
                FROM pg_constraint c
                JOIN pg_class child ON child.oid = c.conrelid
                JOIN pg_namespace child_ns ON child_ns.oid = child.relnamespace
                JOIN pg_class parent ON parent.oid = c.confrelid
                JOIN pg_namespace parent_ns ON parent_ns.oid = parent.relnamespace
                WHERE c.contype = 'f'
                  AND child_ns.nspname = 'public'
                  AND parent_ns.nspname = 'public'
                  AND child.relname = expected.child_table
                  AND parent.relname = expected.parent_table
                  AND c.conkey = (
                    SELECT array_agg(att.attnum ORDER BY cols.ord)
                    FROM unnest(expected.child_columns) WITH ORDINALITY AS cols(column_name, ord)
                    JOIN pg_attribute att
                      ON att.attrelid = child.oid
                     AND att.attname = cols.column_name
                  )
                  AND c.confkey = (
                    SELECT array_agg(att.attnum ORDER BY cols.ord)
                    FROM unnest(expected.parent_columns) WITH ORDINALITY AS cols(column_name, ord)
                    JOIN pg_attribute att
                      ON att.attrelid = parent.oid
                     AND att.attname = cols.column_name
                  )
                  AND (
                    NOT expected.require_cascade
                    OR c.confdeltype = 'c'
                  )
              ) THEN
                RAISE EXCEPTION 'Missing tenant-scoped foreign key %.(%)->%.(%)',
                  expected.child_table,
                  array_to_string(expected.child_columns, ','),
                  expected.parent_table,
                  array_to_string(expected.parent_columns, ',');
              END IF;
            END LOOP;
          END $$;
          SQL
      - name: Run integration tests (PostgreSQL)
        env:
          RUN_MULTI_INSTANCE_TEST: '1'
        run: npm run test:integration

      - name: Run exact requested Gateway verification commands
        run: |
          npm run test
          npm run test:e2e
          npm run test:odoo:static
      - name: Go formatting gate
        working-directory: agent
        run: |
          test -z "$(gofmt -l .)" || { echo 'gofmt required on:'; gofmt -l .; exit 1; }

  odoo19:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U odoo -d postgres && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U odoo -d postgres
      - name: Create Odoo test database
        env:
          PGPASSWORD: odoo
        run: createdb -h 127.0.0.1 -U odoo odoo19_test
      - name: Install and test addon on Odoo 19 Community
        shell: bash
        run: |
          set -euo pipefail
          credential_key="$(python3 -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          docker pull odoo:19.0
          rm -f /tmp/odoo19_test.log
          timeout --signal=TERM --kill-after=30s 12m \
            docker run --rm --network host --name odoo19_test_run \
              -e PGHOST=127.0.0.1 \
              -e PGPORT=5432 \
              -e PGUSER=odoo \
              -e PGPASSWORD=odoo \
              -e ODOO_PRINT_GATEWAY_CREDENTIAL_ACTIVE_VERSION=1 \
              -e ODOO_PRINT_GATEWAY_CREDENTIAL_KEY_V1_B64="$credential_key" \
              -v "$GITHUB_WORKSPACE/odoo_addons:/mnt/extra-addons:ro" \
              -v "$GITHUB_WORKSPACE/agent:/mnt/agent:ro" \
              -v "$GITHUB_WORKSPACE/src:/mnt/src:ro" \
              odoo:19.0 \
              odoo \
                --database=odoo19_test \
                --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
                --without-demo=true \
                --http-interface=127.0.0.1 \
                --init=print_gateway \
                --test-tags=/print_gateway \
                --stop-after-init \
                --log-level=test 2>&1 | tee /tmp/odoo19_test.log
      - name: Assert the Odoo addon tests actually ran and passed
        shell: bash
        run: |
          set -euo pipefail
          stats_line="$(grep -E 'odoo\.tests\.stats: +print_gateway: +[0-9]+ tests' /tmp/odoo19_test.log | tail -1 || true)"
          result_line="$(grep -E 'odoo\.tests\.result: ' /tmp/odoo19_test.log | tail -1 || true)"
          if [ -z "$stats_line" ] || [ -z "$result_line" ]; then
            echo 'ERROR: Odoo test summary lines missing; the suite did not complete.'
            tail -80 /tmp/odoo19_test.log || true
            exit 1
          fi
          echo "$stats_line"
          echo "$result_line"
          test_count="$(printf '%s\n' "$stats_line" | grep -oE '[0-9]+ tests' | awk '{print $1}' || true)"
          if [ -z "$test_count" ] || [ "$test_count" -lt 80 ]; then
            echo "ERROR: Expected at least 80 Odoo addon tests, found ${test_count:-0}."
            exit 1
          fi
          if printf '%s\n' "$result_line" | grep -Eiq '[1-9][0-9]* (failed|error|skipped)' || ! printf '%s\n' "$result_line" | grep -Eiq '0 failed, 0 error\(s\)'; then
            echo 'ERROR: Odoo addon test result contains failures, errors, or skips.'
            exit 1
          fi
