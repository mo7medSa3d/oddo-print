name: TEMP Verify Auth Legacy Dependencies

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inventory legacy session references
        run: |
          set -euo pipefail
          echo "=== managerSessions references ==="
          git grep -n "managerSessions" -- src || true
          echo "=== platformSessions references ==="
          git grep -n "platformSessions" -- src || true
          echo "=== direct legacy session writes ==="
          if git grep -nE 'insert\((managerSessions|platformSessions)\)|INSERT INTO (manager_sessions|platform_sessions)' -- src; then
            echo "FORBIDDEN: new production writes to legacy session tables"
            exit 1
          fi
          echo "=== obsolete manager-session-tx references ==="
          if git grep -n "manager-session-tx" -- src tests; then
            echo "FORBIDDEN: obsolete session transaction adapter reference"
            exit 1
          fi
          echo "=== legacy lifetime references ==="
          git grep -n "LEGACY_SESSION_MAX_AGE_SECONDS" -- src tests || true
          echo "=== v2 cookie references ==="
          git grep -nE 'mgr_session|cust_session|plt_session|mgr_refresh|cust_refresh|plt_refresh' -- src tests | head -n 160 || true
          echo "Legacy dependency inventory completed."
