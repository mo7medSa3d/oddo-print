name: Typecheck diagnostic

# Temporary, branch-scoped diagnostic.
#
# Workflow logs are not readable from this environment (the log blob endpoint
# returns EOF), but check-run *annotations* are. This job runs the real
# typecheck and republishes every `error TS…` line as an annotation, with its
# file and line, so the failure can be read through the API. Delete this file
# once the typecheck is green.

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: read

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and publish errors as annotations
        shell: bash
        run: |
          set -uo pipefail
          npm run typecheck > /tmp/typecheck.txt 2>&1 || true
          tail -c 4000 /tmp/typecheck.txt
          grep -E "error TS[0-9]+" /tmp/typecheck.txt | head -40 | while IFS= read -r line; do
            file="$(printf '%s' "$line" | sed -nE 's/^([^(]+)\(([0-9]+),[0-9]+\).*/\1/p')"
            num="$(printf '%s' "$line" | sed -nE 's/^[^(]+\(([0-9]+),[0-9]+\).*/\1/p')"
            msg="$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r//g')"
            if [ -n "$file" ] && [ -n "$num" ]; then
              echo "::error file=$file,line=$num::$msg"
            else
              echo "::error::$msg"
            fi
          done
