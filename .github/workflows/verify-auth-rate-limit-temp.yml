name: TEMP Verify Auth Rate Limit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres -d app_db && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d app_db
      - name: Run migrations
        run: npm run db:migrate
      - name: Run auth-rate-limit unit tests
        run: npm run test:unit -- tests/auth-rate-limit.test.ts
      - name: Run auth-rate-limit integration tests
        run: npm run test:integration -- tests/auth-rate-limit.test.ts
      - name: Verify no host-clock calls in limiter
        run: |
          ! grep -nE 'Date\.now\(|new Date\(\)' src/lib/auth-rate-limit.ts
          grep -n 'clock_timestamp()' src/lib/auth-rate-limit.ts
          echo "Auth rate limiter timing remains database-clock anchored."
