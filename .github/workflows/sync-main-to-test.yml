name: Temporary main-to-test sync

on:
  push:
    branches:
      - test/http-server-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build merged test tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout test/http-server-ready
          git merge --no-edit -X theirs origin/main
          git rev-parse HEAD | tee /tmp/merged-head.txt
          tar --exclude=.git -czf /tmp/merged-test-tree.tar.gz .

      - name: Upload merged test tree
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: merged-test-tree
          path: |
            /tmp/merged-test-tree.tar.gz
            /tmp/merged-head.txt
