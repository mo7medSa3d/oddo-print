<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="color-scheme" content="light dark"/>
    <meta name="theme-color" content="#2563EB"/>
    <title>Yasser Print Manager — browser preview</title>
    <script>
      (function(){try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
    </script>
    <style>
      html, body { margin: 0; background-color: #fbfbfd; color: #1d1d1f; }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #000000; color: #f5f5f7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./preview/main.ts"></script>
  </body>
</html>
